<div class="authincation" [class.h-100]="checkFullpage" [class.clinic-error-full]="checkFullpage">
  <div class="container h-100">
    <div class="row justify-content-center h-100 align-items-center">
      <div class="col-md-6">
        <div class="error-page">
          <div class="error-inner text-center">
            <div class="dz-error" data-text="403">403</div>
            <h4 class="error-head">
              <i class="fa fa-times-circle text-danger"></i> Không có quyền truy cập!
            </h4>
            <p class="error-head">
              Trang bạn đang cố truy cập bị hạn chế. Vui lòng liên hệ quản trị viên hệ thống.
            </p>
            <div>
              <a [routerLink]="[domainRouter]" class="btn btn-secondary">VỀ TRANG CHỦ</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

@if (permission?.allowAccess) {
  <div class="row">
    <div class="col-xl-12">
      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive active-projects style-1 dataTables_wrapper">
            <div class="tbl-caption">
              <h4 class="heading mb-0">Danh sách đơn vị tính</h4>
              <div class="d-flex flex-wrap align-items-center gap-2">
                <form class="clinic-tbl-search" [formGroup]="searchForm" (ngSubmit)="search()">
                  <div class="input-group input-group-sm">
                    <input
                      class="form-control form-control-sm"
                      placeholder="Tìm tên đơn vị tính..."
                      formControlName="searchText"
                    />
                    <button type="submit" class="btn btn-primary btn-sm" title="Tìm kiếm">
                      <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                  </div>
                </form>
                @if (permission.allowAdd) {
                  <button type="button" class="btn btn-primary btn-sm" (click)="openModal()">+ Thêm mới</button>
                }
                <button type="button" class="btn btn-secondary btn-sm" title="Tải lại trang" (click)="reloadPage()">
                  <i class="fa-solid fa-rotate"></i>
                </button>
              </div>
            </div>
            <table class="table clinic-table mb-0">
              <thead>
                <tr>
                  <th class="text-center" style="width: 70px">STT</th>
                  <th class="sortable" (click)="sort('name')">
                    Tên đơn vị tính
                    <i class="fa-solid ms-1" [ngClass]="table.sortIcon('name')"></i>
                  </th>
                  <th style="width: 120px">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                @for (data of listData; track data.id) {
                  <tr>
                    <td class="text-center">{{ data.stt }}</td>
                    <td><h6 class="mb-0 fs-13">{{ data.name }}</h6></td>
                    <td>
                      @if (permission.allowEdit) {
                        <button
                          type="button"
                          class="btn btn-primary light btn-xs sharp me-1"
                          title="Sửa dữ liệu"
                          (click)="openModal(data)"
                        >
                          <i class="fa-solid fa-pen"></i>
                        </button>
                      }
                      @if (permission.allowDelete) {
                        <button
                          type="button"
                          class="btn btn-danger light btn-xs sharp"
                          title="Xóa dữ liệu"
                          (click)="delete(data.id)"
                        >
                          <i class="fa-solid fa-trash"></i>
                        </button>
                      }
                    </td>
                  </tr>
                } @empty {
                  <tr>
                    <td colspan="3" class="text-center text-muted py-4">Không có dữ liệu</td>
                  </tr>
                }
              </tbody>
            </table>
            <app-table-pager
              [page]="table.page"
              [pageSize]="table.pageSize"
              [total]="table.total"
              (pageChange)="changePage($event)"
              (pageSizeChange)="changePageSize($event)"
            ></app-table-pager>
          </div>
        </div>
      </div>
    </div>
  </div>
} @else {
  <app-not-found isFullPage="false"></app-not-found>
}
<app-loading *ngIf="isLoading"></app-loading>

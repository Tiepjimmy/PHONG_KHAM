<form [formGroup]="formGroup" (ngSubmit)="submitForm()" novalidate class="position-relative">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" aria-label="Đóng" (click)="destroyModal(false)"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6 mb-3">
        <label class="form-label" for="codeVN">
          Mã vùng(VN) <span class="text-danger">(*)</span>
        </label>
        <input
          id="codeVN"
          type="text"
          class="form-control"
          [class.is-invalid]="isInvalid('codeVN')"
          formControlName="codeVN"
          placeholder="Nhập dữ liệu"
          autocomplete="off"
        />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6 mb-3">
        <label class="form-label" for="codeEN">Mã vùng(EN)</label>
        <input
          id="codeEN"
          type="text"
          class="form-control"
          formControlName="codeEN"
          placeholder="Nhập dữ liệu"
          autocomplete="off"
        />
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6 mb-3">
        <label class="form-label" for="nameVN">Tên vùng(VN)</label>
        <input
          id="nameVN"
          type="text"
          class="form-control"
          formControlName="nameVN"
          placeholder="Nhập dữ liệu"
          autocomplete="off"
        />
      </div>
      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6 mb-3">
        <label class="form-label" for="nameEN">Tên vùng(EN)</label>
        <input
          id="nameEN"
          type="text"
          class="form-control"
          formControlName="nameEN"
          placeholder="Nhập dữ liệu"
          autocomplete="off"
        />
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger light btn-sm" (click)="destroyModal(false)">
      <i class="fa-solid fa-xmark me-1"></i>Thoát
    </button>
    <button type="submit" class="btn btn-primary btn-sm">
      <i class="fa-solid fa-floppy-disk me-1"></i>Lưu
    </button>
  </div>
  <app-loading-modal *ngIf="isLoading"></app-loading-modal>
</form>

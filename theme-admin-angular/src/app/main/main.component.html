<div
  id="main-wrapper"
  class="show"
  [ngClass]="{ 'menu-toggle': toggleVal }"
  [class.iconhover-toggle]="mouseOvered"
>
  <!-- Nav header -->
  <div class="nav-header">
    <a [routerLink]="[homeRouter]" class="brand-logo">
      <img class="logo-abbr clinic-logo" [src]="logoName" alt="" />
      <span class="brand-title clinic-brand-title">{{ projectShortName }}</span>
    </a>
    <div class="nav-control" (click)="sidebarToggle()">
      <div class="hamburger" [ngClass]="{ 'is-active': toggleVal }">
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-content">
      <nav class="navbar navbar-expand">
        <div class="collapse navbar-collapse justify-content-between">
          <div class="header-left">
            <form (ngSubmit)="searchMenu()" autocomplete="off">
              <div class="input-group search-area">
                <span class="input-group-text">
                  <button type="submit" class="bg-transparent border-0" aria-label="Tìm chức năng">
                    <svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <circle cx="8.78605" cy="8.78605" r="8.23951" stroke="white" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M14.5168 14.9447L17.7471 18.1667" stroke="white" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </button>
                </span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Tìm chức năng..."
                  name="menuSearch"
                  list="clinic-menu-list"
                  [(ngModel)]="menuSearch"
                />
                <datalist id="clinic-menu-list">
                  @for (menu of menuLeaves; track $index) {
                    <option [value]="menu.objectMenuName"></option>
                  }
                </datalist>
              </div>
            </form>
          </div>
          <ul class="navbar-nav header-right">
            <li class="nav-item dropdown notification_dropdown">
              <a class="nav-link" href="javascript:void(0);" title="Chế độ sáng / tối" (click)="toggleThemeMode()">
                <i class="fa-regular" [ngClass]="isDark ? 'fa-sun' : 'fa-moon'"></i>
              </a>
            </li>
            <li class="nav-item dropdown notification_dropdown">
              <a
                class="nav-link bell dz-fullscreen"
                href="javascript:void(0);"
                title="Toàn màn hình"
                [ngClass]="{ active: isFullscreen }"
                (click)="toggleFullscreen()"
              >
                <svg id="icon-full" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <svg id="icon-minimize" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
                </svg>
              </a>
            </li>
            <li class="nav-item ps-3">
              <div class="dropdown header-profile2">
                <a
                  class="nav-link"
                  href="javascript:void(0);"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <div class="header-info2 d-flex align-items-center">
                    <div class="header-media">
                      <img [src]="avatar || 'assets/img/boy.png'" alt="" />
                    </div>
                    <div class="header-info">
                      <h6>{{ fullName }}</h6>
                      <p>{{ userName }}</p>
                    </div>
                  </div>
                </a>
                <div class="dropdown-menu dropdown-menu-end">
                  <div class="card border-0 mb-0">
                    <div class="card-body px-0 py-2">
                      <a
                        href="javascript:void(0);"
                        class="dropdown-item ai-icon"
                        (click)="openModalInfo()"
                      >
                        <i class="fas fa-user text-primary"></i>
                        <span class="ms-2">Thông tin cá nhân</span>
                      </a>
                      <a
                        href="javascript:void(0);"
                        class="dropdown-item ai-icon"
                        (click)="openModalChangePassword()"
                      >
                        <i class="fas fa-key text-primary"></i>
                        <span class="ms-2">Đổi mật khẩu</span>
                      </a>
                    </div>
                    <div class="card-footer px-0 py-2">
                      <a
                        href="javascript:void(0);"
                        class="dropdown-item ai-icon"
                        (click)="logOut()"
                      >
                        <i class="fas fa-sign-out-alt text-danger"></i>
                        <span class="ms-2 text-danger">Đăng xuất</span>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </div>

  <!-- Sidebar -->
  <app-sidebar (mouseHoverEvent)="iconHoverToggle($event)"></app-sidebar>

  <!-- Content -->
  <div class="content-body">
    <app-header></app-header>
    <div class="container-fluid">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="copyright">
      <p>
        <b>{{ projectName }}</b>
      </p>
    </div>
  </div>
</div>

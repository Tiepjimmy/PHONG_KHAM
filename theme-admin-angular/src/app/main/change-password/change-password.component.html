<form [formGroup]="changePassWordForm" (ngSubmit)="changePassWord()" novalidate class="position-relative">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" aria-label="Đóng" (click)="destroyModal(false)"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 mb-3">
        <label class="form-label" for="passWordOld">
          Mật khẩu cũ <span class="text-danger">(*)</span>
        </label>
        <input
          id="passWordOld"
          type="password"
          autocomplete="on"
          class="form-control"
          [class.is-invalid]="isInvalid('passWordOld')"
          formControlName="passWordOld"
          placeholder="Mật khẩu cũ"
        />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 mb-3">
        <label class="form-label" for="passWordNew">
          Mật khẩu mới <span class="text-danger">(*)</span>
        </label>
        <input
          id="passWordNew"
          type="password"
          autocomplete="on"
          class="form-control"
          [class.is-invalid]="isInvalid('passWordNew')"
          formControlName="passWordNew"
          placeholder="Mật khẩu mới"
        />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 mb-3">
        <label class="form-label" for="passWordEnter">
          Nhập lại mật khẩu mới <span class="text-danger">(*)</span>
        </label>
        <input
          id="passWordEnter"
          type="password"
          autocomplete="on"
          class="form-control"
          [class.is-invalid]="isInvalid('passWordEnter')"
          formControlName="passWordEnter"
          placeholder="Nhập lại mật khẩu mới"
        />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger light btn-sm" (click)="destroyModal(false)">
      <i class="fa-solid fa-xmark me-1"></i>Thoát
    </button>
    <button type="submit" class="btn btn-primary btn-sm">
      <i class="fa-solid fa-floppy-disk me-1"></i>Đổi Mật Khẩu
    </button>
  </div>
  <app-loading-modal *ngIf="isLoading"></app-loading-modal>
</form>

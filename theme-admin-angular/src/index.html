  <script>
    // Used by clinic forms: onkeypress="return isNumber(event)"
    function isNumber(evt) {
      const charCode = evt.which ? evt.which : event.keyCode;
      if (
        charCode > 31 &&
        (charCode < 48 || charCode > 57) &&
        charCode !== 45 &&
        charCode !== 46
      ) {
        return false;
      }
      return true;
    }

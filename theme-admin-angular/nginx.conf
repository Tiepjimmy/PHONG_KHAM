server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (Excel import, document files) can be large
    client_max_body_size 50m;

    # .NET backend (service "api" in docker-compose)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Files served from backend wwwroot/Import (avatars, attachments)
    location /Import/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Swagger (optional, remove if it must not be public)
    location /swagger {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Angular app (hash routing, fallback kept for safety)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
